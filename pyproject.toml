[project]
name = "spendaudit"
version = "0.1.0"
description = "Swipe-time card controls and an AI investigator on real public purchase-card data"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[tool.uv]
package = false
system-certs = true  # this Mac uses a TLS-inspecting proxy; uv must trust system certs

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"spendaudit/export.py" = ["E501"]  # long lines are REPORT.md prose
"spendaudit/writeup.py" = ["E501"]  # long lines are WRITEUP.md prose

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
